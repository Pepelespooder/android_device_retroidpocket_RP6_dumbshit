name: RP6 Android build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/lineage-24.0'
    runs-on: [self-hosted, linux, x64, rp6-android]
    timeout-minutes: 360
    env:
      RP6_ANDROID_ROOT: ${{ vars.RP6_ANDROID_ROOT }}

    steps:
      - name: Check out device tree
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out private RP6 kernel
        uses: actions/checkout@v4
        with:
          repository: Pepelespooder/android_kernel_ayn_qcs8550_ntsync
          ref: rp6-ntsync
          path: .private-kernel
          token: ${{ secrets.NTSYNC_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check build source and proprietary files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RP6_ANDROID_ROOT" || { echo "Set the RP6_ANDROID_ROOT repository variable to the synced Lineage source directory on the runner."; exit 1; }
          root="$(realpath -e "$RP6_ANDROID_ROOT")"
          test -f "$root/build/envsetup.sh" || { echo "RP6_ANDROID_ROOT is not a synced Android source tree."; exit 1; }
          test -d "$root/.repo" || { echo "The Android source tree is missing .repo metadata."; exit 1; }
          test -d "$root/vendor/retroidpocket/RP6/proprietary" || { echo "RP6 vendor files are missing from the runner's Android source tree."; exit 1; }
          test -d "$root/vendor/ayn/qcs8550-common/proprietary" || { echo "QCS8550 common vendor files are missing from the runner's Android source tree."; exit 1; }
          printf '::notice::Using Android source at %s\n' "$root"

      - name: Install device tree and private kernel revision
        shell: bash
        run: |
          set -euo pipefail
          root="$(realpath -e "$RP6_ANDROID_ROOT")"
          device_tree="$root/device/retroidpocket/RP6"
          kernel_tree="$root/kernel/ayn/qcs8550"
          test -d "$device_tree" || { echo "RP6 device tree path is missing. Sync the RP6 Lineage source first."; exit 1; }
          test -d "$kernel_tree/.git" || test -f "$kernel_tree/.git" || { echo "Kernel project checkout is missing."; exit 1; }
          while IFS= read -r status_line; do
            path="${status_line:3}"
            case "$path" in
              Documentation/userspace-api/index.rst|Documentation/userspace-api/ntsync.rst|arch/arm64/configs/vendor/moorechip/kalama_GKI.config|drivers/misc/Kconfig|drivers/misc/Makefile|drivers/misc/ntsync.c|include/uapi/linux/ntsync.h) ;;
              *) echo "Unexpected local kernel change: $path"; exit 1 ;;
            esac
          done < <(git -C "$kernel_tree" status --porcelain)
          rsync -a --delete --exclude='.git' --exclude='.private-kernel' "$GITHUB_WORKSPACE/" "$device_tree/"
          git -C "$kernel_tree" fetch --no-tags "$GITHUB_WORKSPACE/.private-kernel" rp6-ntsync
          git -C "$kernel_tree" checkout --detach --force FETCH_HEAD
          grep -q '^CONFIG_NTSYNC=y$' "$device_tree/configs/kernel/ntsync.config"
          grep -q '^CONFIG_NTSYNC=y$' "$kernel_tree/arch/arm64/configs/vendor/moorechip/kalama_GKI.config"

      - name: Build RP6
        shell: bash
        run: |
          set -euo pipefail
          cd "$RP6_ANDROID_ROOT"
          source build/envsetup.sh
          brunch RP6

      - name: Collect flashable packages
        shell: bash
        run: |
          set -euo pipefail
          product="$RP6_ANDROID_ROOT/out/target/product/RP6"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$product" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.img' \) -print -exec cp -t "$GITHUB_WORKSPACE/artifacts" {} +
          test -n "$(find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -type f -print -quit)" || { echo "No flashable package or image was produced."; exit 1; }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RP6-lineage-24.0-ntsync-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
